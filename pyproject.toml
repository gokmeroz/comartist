[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comartist"
version = "0.1.0"
description = "A foundation for coherent comic chapter generation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pyyaml>=6,<7",
    "streamlit>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/comartist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
