# What happens, in a few sentences. The agents fill in the rest.
premise: >
  G. Maert O'zd and An Alien from Saturn tumble out of the Dark Lord's portal
  into a busy Istanbul street in Summer 2016. Disguised as ordinary tourists,
  they keep up their fake best-friend act while the Alien hunts for
  "multiverse anchors" and G. Maert O'zd secretly tries to learn the real plan.
  The Dark Lord checks in by hologram, impatient, and orders them to stay
  until the job is done.

# Canon: facts the agents must NOT change.
canon:
  # Carried from chapter 1 (Summer 2084).
  - "As of Summer 2084: Alien started working for the intergalactic army in 2080 and constantly makes jokes about his hometown."
  - "As of Summer 2084: G. Maert O'zd's grandfather is from Istanbul and was an AI Engineer in the 2030s."
  - "As of Summer 2084: Alien is a double agent working for the Dark Lord, who secretly wants 2016 back to buy Bitcoins but only ever claims he must alter the multiverse."
  - "As of Summer 2084: The Alien recruited G. Maert O'zd for the 2016 mission because of his grandfather's AI engineering background."
  - "As of Summer 2084: G. Maert O'zd pretends to accept the Dark Lord's 2016 mission to avoid capture and learn more about the plan."
  - "As of Summer 2084: The Dark Lord opened a portal to 2016 and made G. Maert O'zd enter it first, ahead of the Alien."
  # New in this chapter.
  - The portal lands them in Istanbul in Summer 2016.
  - The Dark Lord stays in 2084 and appears only as a glowing red hologram.
  - G. Maert O'zd knows the Alien is a double agent; the Alien does not know he knows.
  - The Dark Lord never says the word "Bitcoin" or mentions buying anything; he only talks about the multiverse.

